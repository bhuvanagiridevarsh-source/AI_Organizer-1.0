<svg viewBox="0 0 1540 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1540" height="220" fill="#faf9f7"/>
<text x="770.0" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#2b2926">Organize & Classify</text>
