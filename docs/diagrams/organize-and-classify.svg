<rect x="1060" y="80" width="200" height="110" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="2"/>
<text x="1160.0" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#d97757">STEP 5</text>
<text x="1160.0" y="132" text-anchor="middle" font-size="13.5" fill="#2b2926">Files are moved into</text>
<text x="1160.0" y="149" text-anchor="middle" font-size="13.5" fill="#2b2926">structure (by date if</text>
